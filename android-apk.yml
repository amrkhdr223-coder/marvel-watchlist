name: Build Android APK
on: { workflow_dispatch: {}, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm run prepare:www
        env: { BACKEND_URL: ${{ secrets.BACKEND_URL }} }
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build (signed release if keystore secrets exist, else debug-signed)
        working-directory: android
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/release.jks \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
              -Pandroid.injected.signing.key.password="$KS_PASS"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with: { name: marvel-watchlist-apk, path: "android/app/build/outputs/apk/**/*.apk" }
